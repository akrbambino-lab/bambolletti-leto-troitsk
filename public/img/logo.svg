<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Бамболлетти — с заботой о каждом ребёнке">
  <defs>
    <path id="top" d="M 26 100 A 74 74 0 0 1 174 100" fill="none"/>
    <path id="bottom" d="M 30 104 A 70 70 0 0 0 170 104" fill="none"/>
  </defs>
  <circle cx="100" cy="100" r="97" fill="#fff"/>
  <circle cx="100" cy="100" r="95.5" fill="none" stroke="#7A3E98" stroke-width="3"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#7A3E98" stroke-width="2"/>

  <text fill="#7A3E98" font-family="'Baloo 2','Nunito',sans-serif" font-weight="800" letter-spacing="1">
    <textPath href="#top" startOffset="50%" text-anchor="middle" font-size="21">БАМБОЛЛЕТТИ</textPath>
  </text>
  <text fill="#7A3E98" font-family="'Nunito',sans-serif" font-weight="800">
    <textPath href="#bottom" startOffset="50%" text-anchor="middle" font-size="12.5">с заботой о каждом ребёнке!</textPath>
  </text>

