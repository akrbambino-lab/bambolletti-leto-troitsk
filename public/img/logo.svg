    <path d="M104 146l-6 2c-1.3.4-2 1.8-1.4 3 .3.7 1 1.1 1.8 1.1l8.6.1.7-6zM126 146l6 2c1.3.4 2 1.8 1.4 3-.3.7-1 1.1-1.8 1.1l-8.6.1-.7-6z"/>
