    <path d="M108 114l-3 30c-.1 2.2 1.6 4 3.8 4 2.1 0 3.9-1.7 3.9-3.8l.5-30zM122 114l3 30c.1 2.2-1.6 4-3.8 4-2.1 0-3.9-1.7-3.9-3.8l-.5-30z"/>
